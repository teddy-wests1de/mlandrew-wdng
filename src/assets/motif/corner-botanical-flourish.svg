<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Corner Botanical Flourish — luxury wedding watermark
    Designed to sit in a section corner; rotate/flip via CSS transform to
    target any of the four corners. Recommended opacity: 3%-8%.
    Palette: Powder Blue #B7C9E2, Dusty Blue #9FB7D5, Slate Blue #7E9FC9
  -->
  <defs>
    <g id="leafA">
      <path d="M0,0 C -14,-10 -16,-30 -8,-45 C -4,-52 -1,-56 0,-58 C 1,-56 4,-52 8,-45 C 16,-30 14,-10 0,0 Z" fill="#B7C9E2" fill-opacity="0.45" stroke="#7E9FC9" stroke-width="0.7" stroke-opacity="0.9"/>
      <path d="M0,0 C -1,-20 -1,-40 0,-58" fill="none" stroke="#7E9FC9" stroke-width="0.5" stroke-opacity="0.6"/>
      <path d="M0,-12 C -4,-14 -7,-16 -10,-20" fill="none" stroke="#9FB7D5" stroke-width="0.4" stroke-opacity="0.6"/>
      <path d="M0,-12 C 4,-14 7,-16 10,-20" fill="none" stroke="#9FB7D5" stroke-width="0.4" stroke-opacity="0.6"/>
      <path d="M0,-26 C -4,-28 -6.5,-31 -9,-35" fill="none" stroke="#9FB7D5" stroke-width="0.4" stroke-opacity="0.6"/>
      <path d="M0,-26 C 4,-28 6.5,-31 9,-35" fill="none" stroke="#9FB7D5" stroke-width="0.4" stroke-opacity="0.6"/>
      <path d="M0,-38 C -3,-40 -5,-42 -7,-45" fill="none" stroke="#9FB7D5" stroke-width="0.4" stroke-opacity="0.6"/>
      <path d="M0,-38 C 3,-40 5,-42 7,-45" fill="none" stroke="#9FB7D5" stroke-width="0.4" stroke-opacity="0.6"/>
    </g>
    <g id="leafB">
      <path d="M0,0 C -9,-7 -10,-19 -5,-29 C -2,-34 -1,-37 0,-40 C 1,-37 2,-34 5,-29 C 10,-19 9,-7 0,0 Z" fill="#B7C9E2" fill-opacity="0.45" stroke="#7E9FC9" stroke-width="0.6" stroke-opacity="0.9"/>
      <path d="M0,0 C -0.5,-14 -0.5,-27 0,-40" fill="none" stroke="#7E9FC9" stroke-width="0.45" stroke-opacity="0.6"/>
      <path d="M0,-9 C -3,-10.5 -5,-12 -7,-14.5" fill="none" stroke="#9FB7D5" stroke-width="0.35" stroke-opacity="0.6"/>
      <path d="M0,-9 C 3,-10.5 5,-12 7,-14.5" fill="none" stroke="#9FB7D5" stroke-width="0.35" stroke-opacity="0.6"/>
      <path d="M0,-19 C -3,-20.5 -4.5,-22.5 -6,-25" fill="none" stroke="#9FB7D5" stroke-width="0.35" stroke-opacity="0.6"/>
      <path d="M0,-19 C 3,-20.5 4.5,-22.5 6,-25" fill="none" stroke="#9FB7D5" stroke-width="0.35" stroke-opacity="0.6"/>
    </g>
    <path id="bud" d="M0,0 C -5,-4 -5,-12 -2,-16 C -1,-17.5 0,-18 0,-18 C 0,-18 1,-17.5 2,-16 C 5,-12 5,-4 0,0 Z" fill="#9FB7D5" fill-opacity="0.5" stroke="#7E9FC9" stroke-width="0.6" stroke-opacity="0.85"/>
    <path id="petal" d="M0,0 C -4,-3 -5,-8 -3,-11 C -1.5,-12.5 0,-13 0,-13 C 0,-13 1.5,-12.5 3,-11 C 5,-8 4,-3 0,0 Z" fill="#B7C9E2" fill-opacity="0.4" stroke="#7E9FC9" stroke-width="0.5" stroke-opacity="0.8"/>
    <g id="blossom">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
      <circle r="1.8" fill="#7E9FC9" fill-opacity="0.6"/>
    </g>
  </defs>

  <!-- main stem, rising from the corner -->
  <g fill="none" stroke="#7E9FC9" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M20,485 C55,455 45,405 85,380" stroke-width="2.4"/>
    <path d="M85,380 C120,358 105,315 150,290" stroke-width="1.8"/>
    <path d="M150,290 C185,270 172,232 215,210" stroke-width="1.3"/>
    <path d="M215,210 C240,197 232,168 260,150" stroke-width="0.9"/>
    <path d="M260,150 C272,142 268,120 282,105" stroke-width="0.5"/>
  </g>

  <!-- secondary branch, breaking the symmetry of the main stem -->
  <g fill="none" stroke="#7E9FC9" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M150,290 C190,300 210,270 250,280" stroke-width="1.3"/>
    <path d="M250,280 C280,288 300,265 330,270" stroke-width="0.8"/>
    <path d="M330,270 C350,274 365,258 385,262" stroke-width="0.45"/>
  </g>

  <!-- leaves along the main stem -->
  <use href="#leafA" transform="translate(45,460) rotate(-40) scale(1.35)"/>
  <use href="#leafA" transform="translate(100,395) rotate(150) scale(1.25)"/>
  <use href="#leafA" transform="translate(110,350) rotate(-35) scale(1.1)"/>
  <use href="#leafB" transform="translate(170,300) rotate(140) scale(1.0)"/>
  <use href="#leafB" transform="translate(185,255) rotate(-30) scale(0.9)"/>
  <use href="#leafB" transform="translate(235,215) rotate(135) scale(0.8)"/>
  <use href="#leafB" transform="translate(245,175) rotate(-25) scale(0.7)"/>
  <use href="#bud" transform="translate(270,140) rotate(10) scale(0.9)"/>
  <use href="#blossom" transform="translate(282,108) scale(1.1)"/>

  <!-- leaves along the secondary branch -->
  <use href="#leafB" transform="translate(195,290) rotate(60) scale(1.0)"/>
  <use href="#leafB" transform="translate(270,278) rotate(-60) scale(0.85)"/>
  <use href="#leafB" transform="translate(310,268) rotate(70) scale(0.7)"/>
  <use href="#bud" transform="translate(350,272) rotate(20) scale(0.7)"/>
  <use href="#blossom" transform="translate(385,260) scale(0.9)"/>
</svg>
