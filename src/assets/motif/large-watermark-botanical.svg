  <use href="#leafB" transform="translate(510,178) rotate(95) scale(0.65)"/>
  <use href="#bud" transform="translate(475,150) rotate(20) scale(1.0)"/>
  <use href="#blossom" transform="translate(460,132) scale(1.2)"/>

  <!-- leaves, center accent -->
  <use href="#leafB" transform="translate(345,560) rotate(-20) scale(1.1)"/>
  <use href="#leafB" transform="translate(348,470) rotate(25) scale(1.0)"/>
  <use href="#leafB" transform="translate(335,400) rotate(-15) scale(0.85)"/>
  <use href="#bud" transform="translate(340,350) rotate(15) scale(0.8)"/>
  <use href="#blossom" transform="translate(335,310) scale(1.0)"/>
