  <use href="#leafA" transform="translate(170,540) rotate(-100) scale(1.3)"/>
  <use href="#leafA" transform="translate(110,500) rotate(-60) scale(1.2)"/>
  <use href="#leafB" transform="translate(100,450) rotate(-130) scale(0.7)"/>
  <use href="#leafB" transform="translate(75,420) rotate(-95) scale(1.05)"/>
  <use href="#leafB" transform="translate(58,370) rotate(-70) scale(0.95)"/>
  <use href="#leafB" transform="translate(75,300) rotate(-110) scale(0.85)"/>
  <use href="#leafB" transform="translate(140,225) rotate(-60) scale(0.75)"/>
  <use href="#leafB" transform="translate(190,178) rotate(-95) scale(0.65)"/>
  <use href="#bud" transform="translate(225,150) rotate(-20) scale(1.0)"/>
  <use href="#blossom" transform="translate(240,132) scale(1.2)"/>

