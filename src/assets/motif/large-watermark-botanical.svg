  <use href="#leafA" transform="translate(400,600) rotate(75) scale(1.4)"/>
  <use href="#leafA" transform="translate(530,540) rotate(100) scale(1.3)"/>
  <use href="#leafA" transform="translate(590,500) rotate(60) scale(1.15)"/>
  <use href="#leafB" transform="translate(625,420) rotate(95) scale(1.05)"/>
  <use href="#leafB" transform="translate(642,370) rotate(70) scale(0.95)"/>
  <use href="#leafB" transform="translate(600,340) rotate(130) scale(0.6)"/>
